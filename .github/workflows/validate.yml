name: Validate CleanSub

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/transaction-detection-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run transaction parser tests
        run: npm test
      - name: Build web app
        run: npm run build
